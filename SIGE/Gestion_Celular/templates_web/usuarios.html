{% extends "base.html" %}
{% block content %}
{% include "_sidebar.html" %}
<div class="content-view">
  <section class="section">
    <div class="section-head"><h2>Usuarios</h2></div>
    <form class="inline-form" method="post" action="{{ url_for('user_create') }}">
      <input name="usuario" placeholder="Usuario" required>
      <input name="clave" placeholder="Clave" type="password" required>
      <select name="rol">{% for role in roles %}<option>{{ role }}</option>{% endfor %}</select>
      <button>Crear usuario</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Usuario</th><th>Rol</th><th></th></tr></thead>
        <tbody>
          {% for row in users %}
          <tr>
            <td>{{ row.usuario }}</td><td>{{ row.rol }}</td>
            <td><form method="post" action="{{ url_for('user_delete', username=row.usuario) }}"><button class="danger">Eliminar</button></form></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </section>
</div>
{% endblock %}
